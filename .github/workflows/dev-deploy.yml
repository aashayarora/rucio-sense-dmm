name: Build and deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# A newer push supersedes an in-flight one; the deployment always ends up on
# the latest dev image either way.
concurrency:
  group: dev-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: aaarora/dmm
  NAMESPACE: ucsd-rucio
  DEPLOYMENT: dmm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # :dev is what the chart deploys (pullPolicy: Always); the sha tag keeps
      # every build addressable for rollback.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart deployment
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          # Accept the secret either as raw YAML or base64-encoded.
          if printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig" 2>/dev/null \
             && grep -q '^apiVersion:' "$RUNNER_TEMP/kubeconfig"; then
            :
          else
            printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          fi
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n "$NAMESPACE" rollout restart deployment/"$DEPLOYMENT"
          kubectl -n "$NAMESPACE" rollout status deployment/"$DEPLOYMENT" --timeout=10m
