replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: "k8s-gen5-01.sdsc.optiputer.net"

tolerations:
  - key: "nautilus.io/reservation"
    value: "sense"
    operator: "Equal"
    effect: "NoSchedule"

postgres:
  enabled: true
  image: postgres:17
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "4"
  env:
    user: "dmm"
    password: "dmm"
    database: "dmm"
  service:
    port: 5432
  dataDir: /var/lib/postgresql/data
  persistence:
    enabled: true
    size: 4Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  nodeSelector: {}
  tolerations: []

dmm:
  image:
    repository: aaarora/dmm-dev
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "4Gi"
      cpu: "4"
    limits:
      memory: "4Gi"
      cpu: "4"
  port: 80

secrets:
  dmmConfig: dmm-config
  rucioClientConfig: rucio-client-config
  senseConfig: sense-config
  certs: dmm-certs
  caBundle: rucio-server-rucio-ca-bundle

certs:
  certFile: hostcert.pem
  keyFile: hostcert.key.pem
  mountDir: /opt/certs

paths:
  dmmConfig: /opt/dmm/dmm.cfg
  senseConfig: /root/.sense-o-auth.yaml
  rucioConfig: /opt/rucio/etc/rucio.cfg
  caBundle: /etc/grid-security/certificates/

service:
  type: ClusterIP
  port: 8080
  targetPort: 80

ingress:
  enabled: true
  className: haproxy
  host: dmm.nrp-nautilus.io
  tls: true
  path: /
  pathType: Prefix
